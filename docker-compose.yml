version: '3.9'
services:
  quote-api:
    image: python:3.11-slim
    container_name: quote-api
    working_dir: /app
    env_file: .env
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt \
      && uvicorn backend.quote_api:app --host ${API_HOST:-0.0.0.0} --port ${API_PORT:-8000}"
    volumes:
      - ./:/app
      - ./data:/data
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    restart: unless-stopped
